<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="white"/>
    <text x="200" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#212121">High Memory Address</text>
    
    <g transform="translate(100, 50)">
        <rect x="0" y="0" width="200" height="80" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">main() frame</text>
        <text x="20" y="55" font-family="'Courier New', monospace" font-size="14">x = 10 (4 bytes)</text>
    </g>
    
    <g transform="translate(100, 130)">
        <rect x="0" y="0" width="200" height="100" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">calculate() frame</text>
        <text x="20" y="55" font-family="'Courier New', monospace" font-size="14">a = 5 (4 bytes)</text>
        <text x="20" y="85" font-family="'Courier New', monospace" font-size="14">b = 10 (4 bytes)</text>
    </g>
    
    <text x="200" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#212121">Low Memory Address</text>
    
    <path d="M 50 200 L 85 200" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="45" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="end">Stack Pointer</text>
</svg>
