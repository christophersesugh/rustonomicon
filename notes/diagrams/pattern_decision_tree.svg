<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Pattern Matching Decision Tree (DAG) &amp; Jump Table</text>

  <!-- Root: Evaluate x -->
  <g transform="translate(325, 60)">
    <rect width="150" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0d47a1">Check x (once)</text>
  </g>

  <!-- Branches from x -->
  <line x1="340" y1="110" x2="160" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="140" font-family="monospace" font-size="14" fill="#c2185b" font-weight="bold">x == 1</text>

  <line x1="400" y1="110" x2="400" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="150" font-family="monospace" font-size="14" fill="#c2185b" font-weight="bold">x == 2</text>

  <line x1="460" y1="110" x2="640" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="140" font-family="monospace" font-size="14" fill="#c2185b" font-weight="bold">_ (other)</text>

  <!-- Node: Check y -->
  <g transform="translate(85, 180)">
    <rect width="150" height="50" rx="8" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f57f17">Check y</text>
  </g>

  <!-- Arm C Result -->
  <g transform="translate(325, 180)">
    <rect width="150" height="50" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">Execute Arm C (2, _)</text>
  </g>

  <!-- Arm D Result -->
  <g transform="translate(565, 180)">
    <rect width="150" height="50" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#b71c1c">Execute Arm D (_)</text>
  </g>

  <!-- Branches from y -->
  <line x1="120" y1="230" x2="70" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="270" font-family="monospace" font-size="14" fill="#c2185b" font-weight="bold">y == 1</text>

  <line x1="200" y1="230" x2="250" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="270" font-family="monospace" font-size="14" fill="#c2185b" font-weight="bold">y == 2</text>

  <!-- Arm A and Arm B -->
  <g transform="translate(10, 300)">
    <rect width="140" height="50" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">Execute Arm A (1, 1)</text>
  </g>

  <g transform="translate(180, 300)">
    <rect width="140" height="50" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">Execute Arm B (1, 2)</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(50, 375)">
    <rect width="700" height="35" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
    <text x="350" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#616161">
      Optimized DAG: Zero redundant checks. Enums &amp; dense integers compile directly to O(1) jump tables.
    </text>
  </g>
</svg>
