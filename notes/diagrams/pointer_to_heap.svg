<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="white"/>
    
    <g transform="translate(50, 50)">
        <text x="75" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Stack Memory</text>
        <rect x="0" y="0" width="150" height="60" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14">user</text>
        <text x="20" y="45" font-family="'Courier New', monospace" font-size="14">ptr = 0x1234</text>
    </g>

    <g transform="translate(300, 50)">
        <text x="75" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Heap Memory</text>
        <rect x="0" y="0" width="150" height="80" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="75" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">Address: 0x1234</text>
        <text x="75" y="55" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">{ name: "..." }</text>
    </g>

    <path d="M 160 80 C 220 80 230 90 285 90" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
