        <text x="20" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">h</text>
        <rect x="40" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="60" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">e</text>
        <rect x="80" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="100" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">l</text>
        <rect x="120" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="140" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">l</text>
        <rect x="160" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="180" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">o</text>
        
        <rect x="200" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="220" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle"> </text>
        <rect x="240" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="260" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">w</text>
        <rect x="280" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="300" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">o</text>
        <rect x="320" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="340" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">r</text>
        <rect x="360" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="380" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">l</text>
        <rect x="400" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="420" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">d</text>
    </g>

    <path d="M 80 20 C 220 20 250 70 285 70" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 80 220 C 250 220 280 80 300 70" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
