<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="white"/>
    
    <g transform="translate(50, 50)">
        <text x="75" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">String s</text>
        <rect x="0" y="0" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="25" font-family="'Courier New', monospace" font-size="14">ptr</text>
        <rect x="0" y="40" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="65" font-family="'Courier New', monospace" font-size="14">len: 11</text>
        <rect x="0" y="80" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="105" font-family="'Courier New', monospace" font-size="14">cap: 11</text>
    </g>

    <g transform="translate(50, 200)">
        <text x="75" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Slice hello</text>
