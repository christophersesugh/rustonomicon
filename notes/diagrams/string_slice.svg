        <text x="10" y="25" font-family="'Courier New', monospace" font-size="14">ptr</text>
        <rect x="0" y="40" width="150" height="40" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
        <text x="10" y="65" font-family="'Courier New', monospace" font-size="14">len: 5</text>
        <text x="75" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle" font-style="italic">Fat pointer</text>
    </g>

    <g transform="translate(300, 50)">
