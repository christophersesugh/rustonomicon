<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="white"/>
    
    <g transform="translate(50, 80)">
        <text x="75" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Reference (s)</text>
        <rect x="0" y="0" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="25" font-family="'Courier New', monospace" font-size="14">ptr</text>
    </g>

    <g transform="translate(250, 50)">
        <text x="75" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Owner (s1)</text>
        <rect x="0" y="0" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="25" font-family="'Courier New', monospace" font-size="14">ptr</text>
        <rect x="0" y="40" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="65" font-family="'Courier New', monospace" font-size="14">len: 5</text>
        <rect x="0" y="80" width="150" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="10" y="105" font-family="'Courier New', monospace" font-size="14">cap: 5</text>
    </g>

    <g transform="translate(480, 50)">
        <text x="100" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Heap Data</text>
        <rect x="0" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="20" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">h</text>
        <rect x="40" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="60" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">e</text>
        <rect x="80" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="100" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">l</text>
        <rect x="120" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="140" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">l</text>
        <rect x="160" y="0" width="40" height="40" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
        <text x="180" y="25" font-family="'Courier New', monospace" font-size="14" text-anchor="middle">o</text>
    </g>

    <path d="M 80 100 C 150 100 180 70 235 70" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 280 70 C 380 70 400 70 465 70" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
