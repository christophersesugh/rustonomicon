<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #334e68; stroke-width: 2; rx: 4; }
      .text { font-family: monospace; font-size: 14px; fill: #102a43; }
      .title { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #102a43; }
      .arrow { stroke: #d64545; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d64545" />
    </marker>
  </defs>

  <text x="300" y="40" class="title" text-anchor="middle">Reference Cycle (Heap Memory Leaked)</text>
  
  <!-- Node A -->
  <rect x="100" y="80" width="160" height="150" class="box" />
  <text x="180" y="105" class="title" text-anchor="middle">Node A</text>
  <rect x="120" y="120" width="120" height="30" class="box" fill="#e0e8f0" />
  <text x="180" y="140" class="text" text-anchor="middle">strong_count: 1</text>
  <rect x="120" y="160" width="120" height="50" class="box" fill="#e0e8f0" />
  <text x="180" y="180" class="text" text-anchor="middle">child_ptr</text>

  <!-- Node B -->
  <rect x="340" y="80" width="160" height="150" class="box" />
  <text x="420" y="105" class="title" text-anchor="middle">Node B</text>
  <rect x="360" y="120" width="120" height="30" class="box" fill="#e0e8f0" />
  <text x="420" y="140" class="text" text-anchor="middle">strong_count: 1</text>
  <rect x="360" y="160" width="120" height="50" class="box" fill="#e0e8f0" />
  <text x="420" y="180" class="text" text-anchor="middle">parent_ptr</text>

  <path d="M 240 190 C 290 190, 290 135, 330 135" class="arrow" />
  <path d="M 360 200 C 310 200, 310 250, 260 250 C 210 250, 210 200, 170 150" class="arrow" fill="none" />
</svg>
