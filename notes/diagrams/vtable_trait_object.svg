<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
    <!-- Stack - Fat Pointer -->
    <rect x="50" y="100" width="200" height="150" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="5" />
    <text x="150" y="125" font-weight="bold" text-anchor="middle">Stack (Fat Pointer)</text>
    <rect x="60" y="140" width="180" height="40" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
    <text x="150" y="165" text-anchor="middle">data_ptr</text>
    <rect x="60" y="190" width="180" height="40" fill="#fffbe6" stroke="#faad14" stroke-width="1" />
    <text x="150" y="215" text-anchor="middle">vtable_ptr</text>

    <!-- Heap - Concrete Data -->
    <rect x="400" y="50" width="180" height="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="5" />
    <text x="490" y="75" font-weight="bold" text-anchor="middle">Heap (Data)</text>
    <rect x="410" y="90" width="160" height="40" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
    <text x="490" y="115" text-anchor="middle">Concrete Struct Fields</text>
    
    <!-- Read-Only Binary - Vtable -->
    <rect x="400" y="200" width="300" height="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="5" />
    <text x="550" y="225" font-weight="bold" text-anchor="middle">Read-Only Memory (Vtable)</text>
    
    <rect x="410" y="240" width="280" height="40" fill="#fffbe6" stroke="#faad14" stroke-width="1" />
    <text x="550" y="265" text-anchor="middle">drop_in_place() (Destructor)</text>
    
    <rect x="410" y="290" width="280" height="40" fill="#fffbe6" stroke="#faad14" stroke-width="1" />
    <text x="550" y="315" text-anchor="middle">size (e.g., 24 bytes)</text>
    
    <rect x="410" y="340" width="280" height="40" fill="#fffbe6" stroke="#faad14" stroke-width="1" />
    <text x="550" y="365" text-anchor="middle">align (e.g., 8 bytes)</text>
    
    <rect x="410" y="390" width="280" height="40" fill="#fffbe6" stroke="#faad14" stroke-width="1" />
    <text x="550" y="415" text-anchor="middle">method_1() ptr</text>

    <!-- Arrows -->
    <!-- data_ptr to Heap -->
    <path d="M 240 160 L 320 160 L 320 100 L 390 100" fill="none" stroke="#1890ff" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    
    <!-- vtable_ptr to Vtable -->
    <path d="M 240 210 L 320 210 L 320 315 L 390 315" fill="none" stroke="#faad14" stroke-width="2" marker-end="url(#arrowhead-orange)"/>

    <defs>
        <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#1890ff" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#faad14" />
        </marker>
    </defs>
</svg>
