<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <!-- Stacks -->
  <g transform="translate(50, 50)">
    <rect width="180" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Thread 1 Stack</text>
    <rect x="10" y="40" width="160" height="40" fill="#fff" stroke="#90caf9"/>
    <text x="90" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">arc_ptr_1 (pointer)</text>
  </g>
  <g transform="translate(50, 250)">
    <rect width="180" height="100" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Thread 2 Stack</text>
    <rect x="10" y="40" width="160" height="40" fill="#fff" stroke="#90caf9"/>
    <text x="90" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">arc_ptr_2 (pointer)</text>
  </g>
  
  <!-- Heap -->
  <g transform="translate(450, 100)">
    <rect width="250" height="200" fill="#f1f8e9" stroke="#689f38" stroke-width="2"/>
    <text x="125" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Heap Allocation (ArcInner)</text>
    
    <rect x="25" y="50" width="200" height="40" fill="#fff" stroke="#ccc"/>
    <text x="125" y="75" text-anchor="middle" font-family="sans-serif" font-size="14">Atomic Strong Count: 2</text>
    
    <rect x="25" y="100" width="200" height="80" fill="#ffe0b2" stroke="#fb8c00"/>
    <text x="125" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Mutex Lock State</text>
    <rect x="35" y="140" width="180" height="30" fill="#fff" stroke="#ccc"/>
    <text x="125" y="160" text-anchor="middle" font-family="sans-serif" font-size="14">Protected Data (T)</text>
  </g>
  
  <!-- Arrows -->
  <line x1="230" y1="110" x2="450" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="310" x2="450" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
