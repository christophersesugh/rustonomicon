<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
    <rect width="100%" height="100%" fill="white"/>
    
    <text x="300" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Memory Layout of a Rust Enum (Tagged Union)</text>
    
    <g transform="translate(50, 80)">
        <rect x="0" y="0" width="150" height="80" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
        <text x="75" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">Discriminant</text>
        <text x="75" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12" text-anchor="middle">(tag, e.g. u8)</text>
        
        <rect x="150" y="0" width="350" height="80" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
        <text x="325" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle">Data</text>
        <text x="325" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12" text-anchor="middle">(Union of all variants, sized to fit largest)</text>
    </g>

    <text x="300" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="14" text-anchor="middle" font-style="italic">Total size = discriminant + padding + largest variant</text>
</svg>
